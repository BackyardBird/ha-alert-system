            title: "Edit Storage (Click Any Row)"
            show_header_toggle: false
            entities:
              - entity: input_text.threshold_entities
                name: "Edit Helper 1"
                icon: mdi:database-edit
                secondary_info: "{{ states('input_text.threshold_entities')|length }} chars"
              - entity: input_text.threshold_entities_2
                name: "Edit Helper 2"
                icon: mdi:database-edit
