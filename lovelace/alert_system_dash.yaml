title: Alert System
views:
  - title: Main
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              # Threshold Alert Management
              Create and manage automatic threshold alerts for your sensors.
              Leave threshold and condition empty for offline-only monitoring.
          - type: entities
            title: System Status
            show_header_toggle: false
            entities:
              - entity: input_boolean.threshold_alerts_enabled
                name: Enable Threshold Alerts
                icon: mdi:toggle-switch
              - entity: input_select.threshold_alert_channel
                name: Default Alert Channel
                icon: mdi:message-alert
              - entity: sensor.threshold_alert_status
                name: Status
                icon: mdi:shield-check
              - entity: sensor.threshold_alert_count
                name: Total Alerts Configured
                icon: mdi:counter
              - type: divider
              - entity: input_number.device_offline_delay_minutes
                name: Device Offline Alert Delay
                icon: mdi:timer
          - type: horizontal-stack
            cards:
              - show_name: true
                show_icon: true
                type: button
                tap_action:
                  action: call-service
                  service: script.list_threshold_alerts
                name: List All
                icon: mdi:format-list-bulleted
              - type: button
                tap_action:
                  action: call-service
                  service: script.test_threshold_alert
                name: Test System
                icon: mdi:test-tube
              - type: button
                tap_action:
                  action: call-service
                  service: script.clear_all_threshold_alerts
                confirmation:
                  text: Are you sure you want to remove all threshold alerts?
                name: Clear All
                icon: mdi:delete-sweep
          - type: entities
            title: Create Alert
            show_header_toggle: false
            entities:
              - entity: input_text.temp_threshold_entity
                name: Entity ID
                icon: mdi:target
              - entity: input_text.temp_threshold_value
                name: Threshold Value (leave empty for offline-only)
                icon: mdi:numeric
              - entity: input_select.temp_threshold_condition
                name: Condition
                icon: mdi:compare
              - type: divider
              - entity: input_text.temp_offline_min
                name: "Custom Offline Delay (Optional)"
                icon: mdi:timer
          - show_name: true
            show_icon: true
            type: button
            tap_action:
              action: call-service
              service: script.create_threshold_alert_from_form
            name: Create Alert
            icon: mdi:plus-circle
          - type: markdown
            title: How to Find Entity IDs
            content: >
              **To find entity IDs for sensors:**

              1. **Developer Tools > States** - Search for sensors

              2. **Settings > Devices & Services > Entities** - Browse all entities

              3. **Copy entity IDs** like `sensor.living_room_temperature`

              **Common sensor patterns:**

              - Temperature: `sensor.*temperature*`
              - Battery: `sensor.*battery*`
              - Humidity: `sensor.*humidity*`
              - Power: `sensor.*power*`

              **Examples:**

              - `sensor.bedroom_temperature`
              - `sensor.phone_battery_level`
              - `sensor.living_room_humidity`
          - type: entities
            title: Remove Alert
            show_header_toggle: false
            entities:
              - entity: input_text.temp_remove_entity
                name: Entity ID to Remove
                icon: mdi:target
          - type: button
            tap_action:
              action: call-service
              service: script.remove_threshold_alert_from_form
            name: Remove Alert
            icon: mdi:delete
          - type: markdown
            title: "Current Storage Contents"
            content: |
              **Helper 1:** {{ states('input_text.threshold_entities')|length }} characters
              ```
