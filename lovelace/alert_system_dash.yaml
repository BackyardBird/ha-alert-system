          - type: markdown
            title: "How to Edit"
            content: |
              ### Editing Instructions:
              1. **Click any "Edit Helper" row** above
              2. **Popup opens** with proper multiline textarea
              3. **Edit the content** using the textarea
              4. **Click "Save"** to apply changes
              5. **Content updates** in the display above

              ### Quick Reference:
              - **View content**: See formatted display above
              - **Edit content**: Click any edit row
              - **Character count**: Shows in secondary info
              - **Format**: `entity:threshold:condition:offline_min`
              - **Offline only**: `entity:::offline_min`

          - type: markdown
            title: Direct Editing Guide
            content: |
              **Warning: Direct editing requires knowledge of the storage format!**

              ### Storage Format:
              ```
              entity:threshold:condition:offline_min
              ```

              For offline-only monitoring (no threshold):
              ```
              entity:::offline_min
              ```

              ### Multiple Entries:
              Separate with `|` (pipe character):
              ```
              sensor.temp:25:above:10|sensor.humidity:70:above:5
              ```

              ### Examples:
              - `sensor.bedroom_temp:25:above:10` *(threshold + 10-min offline delay)*
              - `sensor.outdoor_temp:35:above:30` *(threshold + 30-min offline delay)*
              - `sensor.humidity:70:above` *(threshold, uses global offline delay)*
              - `sensor.garage:::2` *(offline monitoring only, 2-min delay)*
              - `sensor.critical_device::` *(offline monitoring only, uses global delay)*

              ### Field Meanings:
              1. **entity**: sensor.your_sensor_name
              2. **threshold**: numeric value (25, 70, etc.) or empty for offline-only
              3. **condition**: "above" or "below" or empty for offline-only
              4. **offline_min**: minutes for offline delay (optional - leave empty for global)

              ### Editing Tips:
              - **No spaces** around the `:` separators
              - **Use pipe `|`** to separate multiple entries
              - **Test after editing** using "List All" button above
              - **Backup recommended** before major edits
          - type: markdown
            content: |
              ## Alert Configuration Guide

              ### Quick Setup Examples

              #### 1. Standard Indoor Sensor
              - **Entity**: `sensor.living_room_temperature`
              - **Threshold**: `25`, **Condition**: `above`
              - **Offline Delay**: *(leave blank for global delay)*

              #### 2. Critical Safety Device
              - **Entity**: `sensor.smoke_detector_battery`
              - **Threshold**: `20`, **Condition**: `below`
              - **Offline Delay**: `1` *(1-minute for critical devices)*

              #### 3. Outdoor/Unreliable Device
              - **Entity**: `sensor.garden_moisture`
              - **Threshold**: `30`, **Condition**: `below`
              - **Offline Delay**: `30` *(30-minute for outdoor devices)*

              #### 4. Offline Monitoring Only
              - **Entity**: `sensor.garage_door`
              - **Threshold**: *(leave empty)*
              - **Condition**: `offline only`
              - **Offline Delay**: `5`

              ### How Device-Specific Delays Work

              **Current Global Delay:** {{ states('input_number.device_offline_delay_minutes') }} minutes

              #### Priority Order:
              1. **Custom delay** (if set in alert) = Used for this device
              2. **Global delay** (above setting) = Used as fallback
              3. **Zero delay** = Immediate offline alerts

              #### Storage Format:
              `entity:threshold:condition:offline_min`

              **Examples:**
              - `sensor.temp:25:above:10` *(10-min offline delay)*
              - `sensor.humidity:70:above` *(uses global delay)*
              - `sensor.door:::2` *(offline monitoring only, 2-min delay)*

              ### Creating Alerts:
              1. **Find your entity ID** using Developer Tools > States
              2. **Copy the entity_id** (like `sensor.living_room_temperature`)
              3. **Paste it** into the "Entity ID" field above
              4. **Set threshold** and condition (or select "offline only")
              5. **Set custom offline delay** (optional - leave blank for global)
              6. **Click "Create Alert"**

              ### Managing Alerts:
              - **List All**: See current alerts and their status
              - **Remove**: Enter entity_id in remove section
              - **Clear All**: Remove all configured alerts (with confirmation)

              ### Smart Features:
              - **Parallel processing** - Multiple devices can have pending alerts
              - **Auto-cancellation** - If device comes online during delay, no alert sent
              - **Custom indication** - Alerts show "(custom delay)" when applicable
              - **Auto-generated messages** - No need to write alert messages, they are built from entity name and threshold data
              - **Offline-only monitoring** - Monitor device availability without setting a threshold

              ### Tips:
              - Entity IDs look like: `sensor.bedroom_temperature`
              - You can set multiple thresholds for the same entity
              - Alerts use your configured channel (main/technical/both)
              - Test the system after adding new alerts
              - Use longer delays (15-30 min) for outdoor/unreliable devices
              - Use shorter delays (1-2 min) for critical indoor devices
